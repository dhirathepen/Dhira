services:
  - type: web
    name: dhira-backend
    runtime: node
    rootDir: backend
    # SQLite lives in a file, so a persistent disk is required. Disks are not
    # available on the free plan; use Starter or above.
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    autoDeploy: true
    disk:
      name: dhira-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_FILE
        value: /data/dhira.sqlite
      - key: ALLOWED_ORIGINS
        sync: false
      - key: IMAGE_MAX_MB
        value: "8"
