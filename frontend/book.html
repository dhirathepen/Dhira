<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Books — Dhira</title>
  <meta name="description" content="Books by Dhira — works in progress, published titles and everything in between." />
  <link rel="icon" href="logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <nav>
    <a class="nav-logo" href="index.html">Dhira <span>धीरा</span></a>
    <button class="nav-toggle" id="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="nav-links">☰</button>
    <ul class="nav-links" id="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="writing.html">Writing</a></li>
      <li><a href="wits.html">Wits</a></li>
      <li><a href="book.html" class="active">Books</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <div class="subpage-container">
    <p class="page-eyebrow">The Library</p>
    <h1>The <em>Books.</em></h1>
    <p class="subpage-intro">Every book I am writing, revising or dreaming about — collected in one place.</p>
  </div>

  <section class="book-page-section">
    <div id="books-root">
      <div class="loading-state" role="status" aria-live="polite">
        <span class="loading-dot"></span><span>Opening the library…</span>
      </div>
    </div>
  </section>

  <footer>
    <div class="footer-logo">Dhira</div>
    <div class="footer-devanagari">धीरा</div>
  </footer>

  <script src="config.js"></script>
  <script src="js/dhira.js"></script>
  <script>
    (function initBooks() {
      const {
        api, el, clear, formatDate, assetUrl, renderContent, showState, bookStatusLabels,
      } = window.Dhira;

      const root = document.getElementById('books-root');
      const perPage = 12;
      let page = 1;
      let loadMoreButton = null;

      function makeCover(book) {
        if (book.cover && book.cover.url) {
          const image = el('img', 'book-cover book-card-cover');
          image.src = assetUrl(book.cover.url);
          image.alt = book.title ? `${book.title} cover` : 'Book cover';
          image.loading = 'lazy';
          return image;
        }
        const placeholder = el('div', 'book-cover book-cover-placeholder book-card-cover');
        placeholder.appendChild(el('span', 'book-cover-mark', 'धीरा'));
        placeholder.appendChild(el('span', 'book-cover-note', 'Cover coming soon'));
        return placeholder;
      }

      function makeProgress(book) {
        const wrapper = el('div', 'book-progress');
        const info = el('div', 'book-progress-meta');
        info.appendChild(el('span', '', book.progress_note || 'In progress'));
        info.appendChild(el('span', '', `${Number(book.progress_percent) || 0}%`));
        wrapper.appendChild(info);

        const track = el('div', 'progress-track');
        track.setAttribute('role', 'progressbar');
        track.setAttribute('aria-valuemin', '0');
        track.setAttribute('aria-valuemax', '100');
        track.setAttribute('aria-valuenow', String(book.progress_percent || 0));
        track.setAttribute('aria-label', `${book.title} progress`);
        const fill = el('div', 'progress-fill');
        fill.style.width = `${Math.max(0, Math.min(100, Number(book.progress_percent) || 0))}%`;
        track.appendChild(fill);
        wrapper.appendChild(track);
        return wrapper;
      }

      function makeBookCard(book) {
        const card = el('article', 'book-card');

        const media = el('div', 'book-card-media');
        media.appendChild(makeCover(book));
        card.appendChild(media);

        const body = el('div', 'book-card-body');
        if (book.status && bookStatusLabels[book.status]) {
          body.appendChild(el('span', 'update-badge book-status', bookStatusLabels[book.status]));
        }
        body.appendChild(el('h2', 'book-title', book.title || 'Untitled book'));
        if (book.subtitle) body.appendChild(el('p', 'book-subtitle', book.subtitle));

        if (book.introduction) {
          const intro = el('div', 'book-text');
          renderContent(intro, book.introduction);
          body.appendChild(intro);
        }

        if (book.synopsis) {
          const synopsis = el('div', 'book-card-synopsis');
          renderContent(synopsis, book.synopsis);
          body.appendChild(synopsis);
        }

        if (book.release_date) {
          const meta = el('p', 'book-release');
          meta.appendChild(el('span', 'book-release-label', 'Release'));
          meta.appendChild(el('span', '', formatDate(book.release_date)));
          body.appendChild(meta);
        }

        body.appendChild(makeProgress(book));
        card.appendChild(body);
        return card;
      }

      function appendBooks(items, append) {
        if (!append) clear(root);
        const grid = document.getElementById('books-grid') || el('div', 'books-grid');
        grid.id = 'books-grid';
        if (!grid.parentNode) root.appendChild(grid);
        items.forEach((book) => grid.appendChild(makeBookCard(book)));
      }

      async function load(append) {
        if (!append) {
          page = 1;
          clear(root);
          loadMoreButton = null;
        }

        if (loadMoreButton) {
          loadMoreButton.disabled = true;
          loadMoreButton.textContent = 'Loading…';
        }

        try {
          const data = await api.get(`/books?page=${page}&per_page=${perPage}`);
          const items = data.items || [];
          appendBooks(items, append);

          if (!document.getElementById('books-grid').children.length) {
            showState(root, {
              title: 'The library is waiting',
              message: 'Books will appear here as soon as they are added.',
              actionLabel: 'Read the writing',
              onAction: () => { window.location.href = 'writing.html'; },
            });
            return;
          }

          const hasMore = Boolean(data.pagination && data.pagination.has_next);
          if (hasMore && !loadMoreButton) {
            const wrap = el('div', 'updates-more');
            loadMoreButton = el('button', 'btn-outline', 'Load more books');
            loadMoreButton.type = 'button';
            loadMoreButton.addEventListener('click', () => {
              page += 1;
              load(true);
            });
            wrap.appendChild(loadMoreButton);
            root.appendChild(wrap);
          }
          if (loadMoreButton) {
            loadMoreButton.hidden = !hasMore;
            loadMoreButton.disabled = false;
            loadMoreButton.textContent = 'Load more books';
          }
        } catch (error) {
          if (loadMoreButton) {
            loadMoreButton.hidden = true;
            loadMoreButton.disabled = false;
            loadMoreButton.textContent = 'Load more books';
          }
          if (!append) {
            clear(root);
            showState(root, {
              error: true,
              title: 'The library could not be opened',
              message: error.message || 'Please try again in a moment.',
              actionLabel: 'Try again',
              onAction: () => load(false),
            });
          }
        }
      }

      load(false);
    })();
  </script>
</body>
</html>
