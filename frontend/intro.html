<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dhira — धीरा</title>
  <meta name="description" content="Welcome to Dhira." />
  <link rel="icon" href="logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="app.css" />
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--off-white);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .intro-screen {
      position: fixed; inset: 0;
      background: var(--off-white); z-index: 1;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      transition: opacity 0.8s cubic-bezier(0.16,1,0.3,1), visibility 0.8s;
    }
    .intro-screen.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }
    .intro-logo {
      width: 180px; height: auto; margin-bottom: 2.5rem;
      mix-blend-mode: multiply;
      opacity: 0; transform: translateY(15px);
      animation: introLogoFadeIn 1.2s cubic-bezier(0.16,1,0.3,1) forwards;
    }
    .intro-timer {
      font-family: 'Cormorant Garamond', serif; font-size: 6rem; font-weight: 300;
      color: var(--sage); line-height: 1; height: 6rem;
      display: flex; justify-content: center; align-items: center;
      transition: transform 0.4s cubic-bezier(0.16,1,0.3,1), opacity 0.4s;
    }
    .intro-timer.tick { transform: scale(0.8); opacity: 0; }
    .intro-skip {
      position: absolute; top: 2rem; right: 2rem; z-index: 2;
      font-family: 'Inter', sans-serif; font-size: 0.7rem; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--mid-grey); text-decoration: none;
      background: none; border: 0; cursor: pointer; padding: 0.5rem;
    }
    .intro-skip:hover { color: var(--sage); }
    @keyframes introLogoFadeIn { to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      .intro-logo { animation: none; opacity: 1; transform: none; }
      .intro-screen { transition: none; }
      .intro-timer { transition: none; }
    }
  </style>
</head>
<body>
  <button class="intro-skip" id="intro-skip" type="button">Skip intro →</button>
  <div class="intro-screen" id="intro-screen">
    <img src="logo.png" alt="Dhira Logo" class="intro-logo" />
    <div class="intro-timer" id="intro-timer">3</div>
  </div>

  <script>
    (function intro() {
      var HOME = 'index.html';
      var SEEN_KEY = 'dhira_intro_seen';
      var seen = false;
      try { seen = window.sessionStorage.getItem(SEEN_KEY) === '1'; } catch (e) {}

      var screen = document.getElementById('intro-screen');
      var timerEl = document.getElementById('intro-timer');
      var skipped = false;

      function finish() {
        if (skipped) return;
        skipped = true;
        try { window.sessionStorage.setItem(SEEN_KEY, '1'); } catch (e) {}
        screen.classList.add('fade-out');
        window.setTimeout(function () { window.location.replace(HOME); }, 800);
      }

      document.getElementById('intro-skip').addEventListener('click', finish);

      if (seen || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        finish();
        return;
      }

      var count = 3;
      var interval = window.setInterval(function () {
        timerEl.classList.add('tick');
        window.setTimeout(function () {
          count -= 1;
          if (count > 0) {
            timerEl.textContent = count;
            timerEl.classList.remove('tick');
          } else {
            window.clearInterval(interval);
            finish();
          }
        }, 400);
      }, 1000);
    })();
  </script>
</body>
</html>
