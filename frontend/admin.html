<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Dhira</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <!-- ── Login ─────────────────────────────────────────────────────────── -->
  <div class="login-screen" id="login-screen">
    <div class="login-box">
      <div class="login-logo">Dhira <span>धीरा</span></div>
      <p class="login-subtitle">Admin Access</p>
      <form id="login-form" novalidate>
        <div class="login-group">
          <label for="login-user">Username</label>
          <input type="text" id="login-user" name="username" placeholder="your username" autocomplete="username" autocapitalize="none" spellcheck="false" />
        </div>
        <div class="login-group">
          <label for="login-pass">Password</label>
          <input type="password" id="login-pass" name="password" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <button class="login-btn" type="submit" id="login-submit">Sign In</button>
        <p class="login-error" id="login-error" role="alert" aria-live="assertive" hidden></p>
      </form>
      <p class="login-note"><a href="index.html">← Back to the site</a></p>
    </div>
  </div>

  <!-- ── Admin shell ───────────────────────────────────────────────────── -->
  <div class="admin-layout" id="admin-app" hidden>
    <button class="admin-menu-toggle" id="sidebar-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">☰</button>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">Dhira <span>धीरा</span></div>
        <div class="sidebar-tag">Admin Panel</div>
      </div>

      <nav class="sidebar-nav" aria-label="Admin sections">
        <div class="sidebar-section-label">Overview</div>
        <a class="sidebar-link" href="#/dashboard" data-nav="dashboard"><span class="icon">⊞</span> Dashboard</a>

        <div class="sidebar-section-label">Content</div>
        <a class="sidebar-link" href="#/posts" data-nav="posts"><span class="icon">≡</span> All Posts</a>
        <a class="sidebar-link" href="#/posts/new" data-nav="posts-new"><span class="icon">+</span> New Post</a>

        <div class="sidebar-section-label">The Site</div>
        <a class="sidebar-link" href="#/categories" data-nav="categories"><span class="icon">✦</span> Categories</a>
        <a class="sidebar-link" href="#/books" data-nav="books"><span class="icon">◻</span> Books</a>
        <a class="sidebar-link" href="#/author" data-nav="author"><span class="icon">◎</span> Author Profile</a>
        <a class="sidebar-link" href="#/messages" data-nav="messages"><span class="icon">✉</span> Messages <span class="sidebar-badge" id="message-badge" hidden>0</span></a>

        <div class="sidebar-section-label">Account</div>
        <a class="sidebar-link" href="#/account" data-nav="account"><span class="icon">⚙</span> Account</a>
      </nav>

      <div class="sidebar-footer">
        <a href="index.html" target="_blank" rel="noopener">↗ View the site</a>
        <a href="writing.html" target="_blank" rel="noopener">↗ Writing index</a>
        <button class="logout-btn" type="button" id="logout-btn">Sign out</button>
      </div>
    </aside>

    <div class="sidebar-scrim" id="sidebar-scrim"></div>

    <main class="main-content">
      <header class="main-header">
        <h1 id="page-title">Dashboard</h1>
        <div class="header-actions" id="header-actions"></div>
      </header>
      <div class="view-root" id="view-root"></div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div>
  </div>

  <script src="config.js"></script>
  <script src="js/dhira.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
