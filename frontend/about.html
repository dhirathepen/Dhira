  <div class="subpage-container">
    <p class="page-eyebrow">About</p>
    <h1>About <em>Me.</em></h1>
    <p class="subpage-intro">The person writing as Dhira.</p>
  </div>

  <section class="about-section">
    <div id="about-root">
      <div class="loading-state" role="status" aria-live="polite">
        <span class="loading-dot"></span><span>Turning the page…</span>
      </div>
    </div>
  </section>

  <footer>
    <div class="footer-logo">Dhira</div>
    <div class="footer-devanagari">धीरा</div>
  </footer>

  <script src="config.js"></script>
  <script src="js/dhira.js"></script>
  <script>
    (function initAbout() {
      const { api, el, clear, assetUrl, renderContent, showState } = window.Dhira;

      const root = document.getElementById('about-root');

      const FALLBACK = {
        name: 'Mohith',
        pen_name: 'Dhira',
        tagline: 'A jack of all trades, master of none.',
        introduction: [
          'This is Mohith.',
          'A man with a billion dots scattered across the infinite sky of English stars, forever searching for constellations in words, meaning in silence, and stories in the ordinary.',
          '',
          'Not merely to master books, but to become a great storyteller; not simply to write words, but to leave something behind in them.',
          '',
          'Writing as Dhira.',
        ].join('\n'),
        profile_image: { url: 'profile.jpg' },
      };

      function render(author) {
        clear(root);

        const grid = el('div', 'about-grid');

        const photoWrap = el('div', 'about-photo-wrap');
        const photo = el('img', 'about-photo');
        photo.src = author.profile_image && author.profile_image.url
          ? assetUrl(author.profile_image.url)
          : 'profile.jpg';
        photo.alt = author.name ? `Portrait of ${author.name}` : 'Author portrait';
        photo.addEventListener('error', () => { photo.src = 'profile.jpg'; }, { once: true });
        photoWrap.appendChild(photo);
        grid.appendChild(photoWrap);

        const copy = el('div', 'about-copy');

        const intro = el('div', 'about-intro');
        renderContent(intro, author.introduction || FALLBACK.introduction);
        copy.appendChild(intro);

        grid.appendChild(copy);
        root.appendChild(grid);
      }

      async function load() {
        try {
          const data = await api.get('/author');
          const author = data && data.author ? data.author : FALLBACK;
          render({ ...FALLBACK, ...author });
        } catch (error) {
          if (error.status === 0 || error.status >= 500) {
            render(FALLBACK);
          } else {
            clear(root);
            showState(root, {
              error: true,
              title: 'The page could not be loaded',
              message: error.message || 'Please try again in a moment.',
              actionLabel: 'Try again',
              onAction: load,
            });
          }
        }
      }

      load();
    })();
  </script>
</body>
